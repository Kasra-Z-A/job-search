[project]
name = "job-search"
version = "0.1.0"
description = "Plain-language search over remote job postings"
readme = "README.md"
authors = [
    { name = "Kasra-Z-A" }
]
requires-python = ">=3.12"
# What the search backend needs at runtime; the Lambda package installs only these.
dependencies = [
    "anthropic>=1.13.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "openai>=3.31.0",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "boto3>=1.43.114",
    "pytest>=9.1.1",
]
# Data pipeline and baselines only: language detection, BM25.
pipeline = [
    "lingua-language-detector>=2.2.0",
    "rank-bm25>=0.2.2",
    "snowballstemmer>=3.1.1",
]

[tool.uv]
default-groups = ["dev", "pipeline"]
