[project]
name = "job-search"
version = "0.1.0"
description = "Plain-language search over remote job postings"
readme = "README.md"
authors = [
    { name = "Kasra-Z-A" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.13.0",
    "httpx>=0.28.1",
    "lingua-language-detector>=2.2.0",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
